name: Local V4 Studio safety checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/v4-studio.html'
      - 'dashboard/index.html'
      - 'utils/v4-local-gallery.js'
      - 'test/v4-local-gallery.test.js'
      - 'test/v4-local-readiness.test.js'
      - 'utils/v4-local-readiness.js'
      - 'utils/v4-demand-supply-pilot.js'
      - 'test/v4-demand-supply-pilot.test.js'
      - 'test/v4-studio-auth-preview.test.js'
      - 'scripts/v4-safe-deploy.py'
      - 'scripts/v4-offline-course-pack.js'
      - 'utils/v4-generic-scene-html.js'
      - 'utils/v4-host-v10-voice-queue.js'
      - 'scripts/v4-render-host-v10.js'
      - 'test/v4-generic-scene-html.test.js'
      - 'test/v4-host-v10-voice-queue.test.js'
      - 'utils/v4-offline-course-renderer.js'
      - 'scripts/v4-render-course-video.js'
      - 'test/v4-offline-course-renderer.test.js'
      - 'scripts/v4-generic-scene-smoke.js'
      - 'test/v4-generic-scene-smoke.test.js'
      - 'utils/v4-hyperframes-lint.js'
      - 'test/v4-hyperframes-lint.test.js'
      - 'examples/v4-repo-rate-emi-2026.lesson.json'
      - 'scripts/v4-one-shot-review.js'
      - 'test/v4-one-shot-review.test.js'
      - 'test/v4-repo-rate-lesson.test.js'
      - 'test/v4-host-v10-voice-queue.test.js'
      - 'utils/v4-host-v10-voice-queue.js'
      - 'test/v4-offline-course-pack.test.js'
      - 'scripts/test_v4_safe_deploy.py'
      - '.github/workflows/v4-studio-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax and local security tests
        run: |
          node --check utils/v4-local-gallery.js
          node --check utils/v4-local-readiness.js
          node --check utils/v4-demand-supply-pilot.js
          node --check scripts/v4-offline-course-pack.js
          node --check utils/v4-generic-scene-html.js
          node --check utils/v4-host-v10-voice-queue.js
          node --check scripts/v4-render-host-v10.js
          node --check utils/v4-offline-course-renderer.js
          node --check scripts/v4-render-course-video.js
          node --check scripts/v4-generic-scene-smoke.js
          node --check utils/v4-hyperframes-lint.js
          node --check scripts/v4-one-shot-review.js
          node --test test/v4-local-gallery.test.js test/v4-local-readiness.test.js test/v4-demand-supply-pilot.test.js test/v4-studio-auth-preview.test.js test/v4-offline-course-pack.test.js test/v4-generic-scene-html.test.js test/v4-host-v10-voice-queue.test.js test/v4-offline-course-renderer.test.js test/v4-generic-scene-smoke.test.js test/v4-hyperframes-lint.test.js test/v4-one-shot-review.test.js test/v4-repo-rate-lesson.test.js
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('dashboard/v4-studio.html','utf8');const m=s.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('Studio JS missing');new vm.Script(m[1]);console.log('Studio JS syntax OK')"
      - name: Verify pinned Termux installer safety and syntax
        run: |
          python3 -m py_compile scripts/v4-safe-deploy.py scripts/test_v4_safe_deploy.py
          python3 -m unittest discover -s scripts -p 'test_v4_safe_deploy.py' -v
      - name: Check no publishing controls changed
        run: |
          git diff --check
