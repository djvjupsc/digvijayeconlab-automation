name: Upload personally reviewed video as PRIVATE (manual only)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'GitHub Actions run ID that produced the approved video'
        type: string
        required: true
      video_sha256:
        description: 'Exact professional.mp4 SHA256 from its quality-report.json'
        type: string
        required: true
      approval_phrase:
        description: 'Type I_REVIEWED_FULL_AUDIO_VISUALS_FACTS_AND_RIGHTS'
        type: string
        required: true
      review_note:
        description: 'Specific factual, audio, visual, caption and rights review note (35+ characters)'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  upload-reviewed-private:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: youtube-private-upload
    steps:
      - name: Check out verified upload gate
        uses: actions/checkout@v4
      - name: Confirm the producer run completed on trusted main branch
        uses: actions/github-script@v7
        env:
          SOURCE_RUN: ${{ inputs.source_run_id }}
        with:
          script: |
            const runId = Number(process.env.SOURCE_RUN);
            if (!Number.isSafeInteger(runId) || runId <= 0) throw Error('Invalid source run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId
            });
            const expectedRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (run.conclusion !== 'success' || run.head_branch !== 'main' ||
                run.head_repository?.full_name !== expectedRepo ||
                !['push','workflow_dispatch'].includes(run.event)) {
              throw Error('Untrusted or unsuccessful production run; upload blocked');
            }
            const { data: workflow } = await github.rest.actions.getWorkflow({
              owner: context.repo.owner, repo: context.repo.repo, workflow_id: run.workflow_id
            });
            if (workflow.path !== '.github/workflows/jugnu-cloud-preview.yml') {
              throw Error('Source artifact not produced by the approved cloud workflow');
            }
      - name: Download exactly the reviewed GitHub Actions artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          pattern: hindi-tts-ffmpeg-review-*
          merge-multiple: true
          path: reviewed
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Google YouTube OAuth API client
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client==2.149.0 google-auth==2.35.0
      - name: Verify exact artifact checksum and human review BEFORE loading credentials
        env:
          VIDEO_SHA: ${{ inputs.video_sha256 }}
          REVIEW_PHRASE: ${{ inputs.approval_phrase }}
          REVIEW_NOTE: ${{ inputs.review_note }}
        run: |
          python cloud-render/release_gate.py --artifact-dir reviewed --sha256 "$VIDEO_SHA" --approval-phrase "$REVIEW_PHRASE" --review-note "$REVIEW_NOTE"
      - name: Upload privately to the expected channel
        env:
          VIDEO_SHA: ${{ inputs.video_sha256 }}
          REVIEW_PHRASE: ${{ inputs.approval_phrase }}
          REVIEW_NOTE: ${{ inputs.review_note }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_EXPECTED_CHANNEL_ID: ${{ secrets.YT_EXPECTED_CHANNEL_ID }}
          YT_AUDIENCE: ${{ secrets.YT_AUDIENCE }}
        run: |
          python cloud-render/upload_private.py --artifact-dir reviewed --sha256 "$VIDEO_SHA" --approval-phrase "$REVIEW_PHRASE" --review-note "$REVIEW_NOTE" --upload
